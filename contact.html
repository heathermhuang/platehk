<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">

  <style>
    body { margin:0; background:#f4f1e8; color:#17261f; font-family:system-ui,sans-serif; line-height:1.6; }
    main { max-width:580px; margin:48px auto; padding:24px; }
    .contact-card { border:1px solid #c9cec6; background:#fffcf5; padding:28px; margin-top:24px; }
    h1 { font-size:28px; line-height:1.25; margin:12px 0; }
    .plate { display:inline-block; font-size:28px; margin:12px 0; }
    .price { font-size:32px; font-weight:800; margin:16px 0; }
    button, .contact-action { display:block; box-sizing:border-box; width:100%; padding:14px; border:1px solid #1b5f45; background:#1b5f45; color:#fff; font:inherit; font-weight:700; text-align:center; text-decoration:none; cursor:pointer; }
    button:disabled { opacity:.65; cursor:wait; }
    a { color:#1b5f45; } .contact-action[hidden], [hidden] { display:none; }
    .contact-card a.contact-action { color:#fff !important; }
    #status { overflow-wrap:anywhere; } .links { display:flex; flex-wrap:wrap; gap:16px; margin-top:20px; }
    :focus-visible { outline:3px solid #bf701a; outline-offset:4px; }
    @media (max-width:620px) { main { margin:16px auto; padding:16px; } .contact-card { padding:20px; } }
  </style>
  <script src="/assets/contact-unlock.js?v=20261006-01" defer></script>

<body>
  <main>
    <a href="/">Plate.hk</a>
    <section class="contact-card">
      <h1 id="title">解鎖賣方 WhatsApp</h1>
      <div id="plate" class="plate" hidden></div>
      <p id="description">付款 HK$99，解鎖此刊登的賣方 WhatsApp 號碼。</p>

      <button id="pay" type="button" hidden>付款 HK$99 並解鎖</button>
      <button id="retry" type="button" hidden>重新檢查付款</button>
      <a id="whatsapp" class="contact-action" target="_blank" rel="noopener noreferrer" hidden>開啟賣方 WhatsApp</a>
      <div class="links"><a id="source" target="_blank" rel="nofollow noopener noreferrer" hidden>免費查看 28car 原刊登</a><a id="terms" href="/terms.html">使用條款</a><a id="privacy" href="/privacy.html">私隱政策</a></div>
    </section>
