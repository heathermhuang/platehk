name: Auto Heal Data

on:
  workflow_run:
    workflows:
      - Auto Update Data
    types:
      - completed
  schedule:
    # 10:15 Hong Kong time: audit whether the normal 08:40 update left production fresh.
    - cron: "15 2 * * *"
  workflow_dispatch:
    inputs:
      repair_mode:
        description: "Repair mode"
        type: choice
        required: true
        default: auto
        options:
          - auto
          - events
          - incremental
          - full
      deploy:
        description: "Deploy to Cloudflare after a successful repair"
        type: boolean
        required: true
        default: true
      dry_run:
        description: "Run repair and verification without committing or deploying"
        type: boolean
        required: true
        default: false

concurrency:
  group: platehk-auto-heal
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  heal:
    name: Classify and repair updater failure
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: "1"
      CHECK_SECURITY_SKIP_DEPS: "1"
      PYTHONPYCACHEPREFIX: /tmp/pvrm-pycache
      WRANGLER_SEND_METRICS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Collect updater evidence
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_EVENT: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p logs/autoheal
          if [ "$SOURCE_EVENT" = "workflow_run" ] && [ -n "$FAILED_RUN_ID" ]; then
            gh run view "$FAILED_RUN_ID" --repo "$REPOSITORY" --log-failed > logs/autoheal/failed.log || true
          else
            echo "Auto-heal ${SOURCE_EVENT} run without a failed upstream workflow." > logs/autoheal/failed.log
          fi

          set +e
          python scripts/check_production_freshness.py --base-url https://plate.hk --fail-on-drift --json > logs/autoheal/freshness.json
          freshness_status=$?
          set -e
          echo "freshness_status=${freshness_status}" >> logs/autoheal/evidence.env
          cat logs/autoheal/freshness.json

      - name: Classify repair plan
        id: plan
        run: |
          python scripts/auto_heal_update.py classify \
            --log-file logs/autoheal/failed.log \
            --freshness-json logs/autoheal/freshness.json \
            --output logs/autoheal/plan.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Override repair mode from manual input
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.repair_mode != 'auto' }}
        id: override
        run: |
          mode="${{ github.event.inputs.repair_mode }}"
          case "$mode" in
            events) action="run_events_repair" ;;
            incremental) action="run_incremental_update" ;;
            full) action="run_full_update" ;;
            *) echo "::error::Unknown repair mode: $mode"; exit 1 ;;
          esac
          echo "action=${action}" >> "$GITHUB_OUTPUT"
          echo "status=repairable" >> "$GITHUB_OUTPUT"
          echo "deploy_required=true" >> "$GITHUB_OUTPUT"

      - name: Open human repair issue
        id: repair_issue
        if: ${{ steps.plan.outputs.status == 'blocked' || steps.plan.outputs.status == 'escalate' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          title="PlateHK auto-heal needs repair: ${{ steps.plan.outputs.classification }}"
          issue_body="logs/autoheal/repair-issue.md"
          {
            echo "Auto-heal could not complete deterministic recovery."
            echo ""
            echo "- Run: ${RUN_URL}"
            echo "- Classification: ${{ steps.plan.outputs.classification }}"
            echo "- Status: ${{ steps.plan.outputs.status }}"
            echo "- Action: ${{ steps.plan.outputs.action }}"
            echo "- Confidence: ${{ steps.plan.outputs.confidence }}"
            echo ""
            echo "Next steps:"
            echo "1. Inspect the autoheal evidence artifact from this run."
            echo "2. If this is credentials or permissions, fix the GitHub/Cloudflare setting and rerun Auto Heal."
            echo "3. If this is parser or source-shape drift, create a branch/PR with a fixture and regression test."
            echo "4. Do not let an LLM patch main directly; use the PR path and keep deterministic checks green."
            echo ""
            echo "Plan:"
            echo '```json'
            cat logs/autoheal/plan.json 2>/dev/null || true
            echo '```'
          } > "$issue_body"

          issue_number="$(gh issue list --repo "$REPOSITORY" --state open --search "${title} in:title" --json number --jq '.[0].number // ""' 2>/dev/null)"
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --repo "$REPOSITORY" --body-file "$issue_body" \
              || echo "::warning::Could not comment on existing auto-heal issue."
          else
            issue_url="$(gh issue create --repo "$REPOSITORY" --title "$title" --body-file "$issue_body" 2>/dev/null)" \
              || echo "::warning::Could not create auto-heal issue."
            if [ -n "${issue_url:-}" ]; then
              issue_number="$(gh issue view "$issue_url" --repo "$REPOSITORY" --json number --jq '.number' 2>/dev/null)"
            fi
          fi

          issue_url="${issue_url:-}"
          if [ -n "$issue_number" ] && [ -z "$issue_url" ]; then
            issue_url="$(gh issue view "$issue_number" --repo "$REPOSITORY" --json url --jq '.url' 2>/dev/null)"
          fi

          python - "$issue_number" "$issue_url" <<'PY'
          import json
          import sys
          from pathlib import Path

          Path("logs/autoheal/issue.json").write_text(
              json.dumps({"number": sys.argv[1], "url": sys.argv[2]}, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          echo "number=${issue_number}" >> "$GITHUB_OUTPUT"
          echo "url=${issue_url}" >> "$GITHUB_OUTPUT"

      - name: Notify Telegram about repair issue
        if: ${{ steps.plan.outputs.status == 'blocked' || steps.plan.outputs.status == 'escalate' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
          TELEGRAM_TEXT: |-
            PlateHK auto-heal needs attention.
            Classification: ${{ steps.plan.outputs.classification }}
            Action: ${{ steps.plan.outputs.action }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TELEGRAM_LINK: ${{ steps.repair_issue.outputs.url }}
        run: >-
          python scripts/notify_telegram.py send --optional
          --text-env TELEGRAM_TEXT --link-env TELEGRAM_LINK
          --link-label "Open repair issue"

      - name: Stop for human or LLM repair
        if: ${{ steps.plan.outputs.status == 'blocked' || steps.plan.outputs.status == 'escalate' }}
        run: |
          echo "::error::Auto-heal stopped: ${{ steps.plan.outputs.classification }} requires ${{ steps.plan.outputs.action }}."
          cat logs/autoheal/plan.json
          exit 1

      - name: Install Python dependencies
        if: ${{ steps.plan.outputs.status == 'repairable' || steps.override.outputs.status == 'repairable' }}
        run: |
          python --version
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Set up Node
        if: ${{ steps.plan.outputs.status == 'repairable' || steps.override.outputs.status == 'repairable' }}
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install Node dependencies
        if: ${{ steps.plan.outputs.status == 'repairable' || steps.override.outputs.status == 'repairable' }}
        run: npm ci

      - name: Refresh privacy-minimized 28car sale signals
        if: ${{ steps.plan.outputs.status == 'repairable' || steps.override.outputs.status == 'repairable' }}
        run: >-
          python scripts/scrape_28car_market.py
          --max-pages 0
          --require-complete
          --concurrency 4
          --request-delay 0.75

      - name: Execute deterministic repair
        if: ${{ steps.plan.outputs.status == 'repairable' || steps.override.outputs.status == 'repairable' }}
        env:
          PLAN_ACTION: ${{ steps.override.outputs.action || steps.plan.outputs.action }}
        run: |
          case "$PLAN_ACTION" in
            run_events_repair)
              python scripts/build_events.py
              python scripts/build_popular_plate_pages.py
              python scripts/build_public_api.py
              python scripts/build_audit_report.py
              python scripts/verify_data_integrity.py
              ;;
            run_incremental_update|retry_auto_update)
              MODE=incremental bash scripts/cron_update.sh
              ;;
            run_full_update)
              MODE=full bash scripts/cron_update.sh
              ;;
            no_op)
              echo "No repair needed."
              ;;
            *)
              echo "::error::No deterministic repair command for ${PLAN_ACTION}"
              exit 1
              ;;
          esac

      - name: Run local verification
        if: ${{ steps.plan.outputs.status == 'repairable' || steps.override.outputs.status == 'repairable' }}
        env:
          PYTHON_BIN: python
        run: ./scripts/check_site.sh

      - name: Stage generated changes
        id: changes
        if: ${{ steps.plan.outputs.status == 'repairable' || steps.override.outputs.status == 'repairable' }}
        run: |
          git add \
            api/v1 \
            assets \
            data \
            plates \
            index.html \
            landing.html \
            audit.html \
            api.html \
            camera.html \
            changelog.html \
            terms.html \
            privacy.html \
            mcp.html \
            robots.txt \
            sitemap.xml \
            llms.txt \
            agent.md \
            skill.md \
            sw.js
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No generated data changes."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit generated changes
        id: commit
        if: ${{ steps.changes.outputs.changed == 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto-heal PlateHK data ($(date -u +%Y-%m-%d))"
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Check Cloudflare deploy credentials
        if: ${{ github.event.inputs.deploy != 'false' && (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true') && (steps.changes.outputs.changed == 'true' || steps.plan.outputs.deploy_required == 'true' || steps.override.outputs.deploy_required == 'true') }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN GitHub Actions repository secret. Required for auto-heal Cloudflare deploys."
            exit 1
          fi

      - name: Deploy to Cloudflare
        if: ${{ github.event.inputs.deploy != 'false' && (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true') && (steps.changes.outputs.changed == 'true' || steps.plan.outputs.deploy_required == 'true' || steps.override.outputs.deploy_required == 'true') }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run cf:deploy:ci

      - name: Verify production after deploy
        if: ${{ github.event.inputs.deploy != 'false' && (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true') && (steps.changes.outputs.changed == 'true' || steps.plan.outputs.deploy_required == 'true' || steps.override.outputs.deploy_required == 'true') }}
        run: |
          verified=false
          for attempt in 1 2 3 4 5; do
            if python scripts/check_production_freshness.py --base-url https://plate.hk --fail-on-drift \
              && python scripts/check_market_production.py --base-url https://plate.hk; then
              verified=true
              break
            fi
            echo "Production is not fresh yet; retrying in 20 seconds (attempt ${attempt}/5)."
            sleep 20
          done
          if [ "$verified" != "true" ]; then
            python scripts/check_production_freshness.py --base-url https://plate.hk --fail-on-drift
            python scripts/check_market_production.py --base-url https://plate.hk
          fi

      - name: Write summary
        if: always()
        run: |
          {
            echo "### PlateHK auto-heal"
            echo ""
            echo "- Classification: ${{ steps.plan.outputs.classification || 'unknown' }}"
            echo "- Plan status: ${{ steps.plan.outputs.status || 'unknown' }}"
            echo "- Action: ${{ steps.override.outputs.action || steps.plan.outputs.action || 'unknown' }}"
            echo "- Dry run: ${{ github.event.inputs.dry_run || 'false' }}"
            echo "- Generated data changed: ${{ steps.changes.outputs.changed || 'false' }}"
            echo "- Generated data committed: ${{ steps.commit.outputs.committed || 'false' }}"
            echo "- Deploy requested by plan: ${{ steps.override.outputs.deploy_required || steps.plan.outputs.deploy_required || 'false' }}"
            echo ""
            echo "Plan:"
            echo '```json'
            cat logs/autoheal/plan.json 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload auto-heal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoheal-evidence-${{ github.run_id }}
          path: logs/autoheal/
          if-no-files-found: ignore
          retention-days: 14
