name: Configure Agent Discovery DNS

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Create missing Plate.hk discovery records (never edit or delete)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: platehk-agent-discovery-dns
  cancel-in-progress: false

jobs:
  configure:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify DNS setup safety contracts
        run: python -m unittest discover -s tests -p test_agent_discovery_dns.py
      - name: Check or create discovery records
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DNS_APPLY: ${{ inputs.apply }}
        run: |
          if [ "$DNS_APPLY" = true ]; then
            python scripts/configure_agent_discovery_dns.py --apply
          else
            python scripts/configure_agent_discovery_dns.py --check
          fi
