name: Auto-heal Issue Telegram

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Discover TELEGRAM_CHAT_ID or test configured delivery"
        type: choice
        required: true
        default: discover
        options:
          - discover
          - test
  issues:
    types:
      - opened
      - reopened
      - closed
      - assigned
      - labeled
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: read

jobs:
  notify:
    name: Notify Telegram about repair issue activity
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'PlateHK auto-heal needs repair:') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Send Telegram configuration test
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'test' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
          TELEGRAM_TEXT: PlateHK Telegram issue notifications are configured.
          TELEGRAM_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python scripts/notify_telegram.py send
          --text-env TELEGRAM_TEXT --link-env TELEGRAM_LINK
          --link-label "Open test run"

      - name: Discover Telegram chat ID
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'discover' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: >-
          python scripts/notify_telegram.py discover-chat
          --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Send issue activity to Telegram
        if: ${{ github.event_name != 'workflow_dispatch' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
          ISSUE_ACTION: ${{ github.event.action }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_ACTOR: ${{ github.actor }}
          ISSUE_COMMENT: ${{ github.event.comment.body }}
        run: python scripts/notify_telegram.py issue-event --optional
