name: Security

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  security-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: services/whatsapp-introductions/package-lock.json

      - name: Install runtime and security tooling
        run: |
          python --version
          python -c 'import sys; sys.exit(f"Expected Python 3.12+, got {sys.version.split()[0]}") if sys.version_info < (3, 12) else None'
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pip-audit

      - name: Scan tracked files for secrets
        run: python scripts/scan_repo_secrets.py

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt --progress-spinner=off

      - name: Audit WhatsApp introduction service dependencies
        run: |
          npm ci --prefix services/whatsapp-introductions
          npm audit --prefix services/whatsapp-introductions --omit=dev

      - name: Install project test dependencies
        run: npm ci

      - name: Run local verification suite
        env:
          CHECK_SECURITY_SKIP_DEPS: "1"
          PYTHON_BIN: python
        run: ./scripts/check_site.sh

      - name: Install Chromium and WebKit for browser regression checks
        run: npx playwright install --with-deps chromium webkit

      - name: Verify plate flows and shared design across desktop and mobile browsers
        run: npx playwright test e2e/decision.spec.mjs e2e/auction-results.spec.mjs e2e/ux.spec.mjs e2e/growth.spec.mjs e2e/design-consistency.spec.mjs e2e/browser-compatibility.spec.mjs e2e/search-layout.spec.mjs --workers=1
