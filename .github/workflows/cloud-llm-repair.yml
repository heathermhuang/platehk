name: Cloud LLM Repair

on:
  workflow_run:
    workflows:
      - Auto Heal Data
    types:
      - completed
  workflow_dispatch:
    inputs:
      mode:
        description: "Connection check or isolated automatic repair drill"
        type: choice
        default: connection
        options: [connection, repair_drill]

concurrency:
  group: platehk-cloud-llm-repair-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  connection_test:
    name: Test custom LLM connection
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode != 'repair_drill' }}
    # Pin after Codex drop-sudo socket ACL verification failed on Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout without credentials
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Require custom provider credentials
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_RESPONSES_API_ENDPOINT: ${{ secrets.OPENAI_RESPONSES_API_ENDPOINT }}
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ] || [ -z "${OPENAI_RESPONSES_API_ENDPOINT:-}" ]; then
            echo "::error::Set OPENAI_API_KEY and OPENAI_RESPONSES_API_ENDPOINT first."
            exit 1
          fi

      - name: Make one read-only model request
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1, pinned to the verified connection runtime
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          responses-api-endpoint: ${{ secrets.OPENAI_RESPONSES_API_ENDPOINT }}
          model: gpt-5.6-sol
          codex-version: "0.167.0"
          prompt: >-
            Connection test only. Do not inspect or change repository files.
            Reply exactly: PlateHK cloud LLM connection OK
          codex-args: '["--ephemeral"]'
          permission-profile: ":read-only"
          safety-strategy: drop-sudo

  inspect_escalation:
    name: Inspect auto-heal escalation
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'repair_drill') ||
          (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      issues: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      is_drill: ${{ steps.source.outputs.is_drill }}
      should_run: ${{ steps.plan.outputs.should_run }}
      classification: ${{ steps.plan.outputs.classification }}
      issue_number: ${{ steps.plan.outputs.issue_number }}
      issue_url: ${{ steps.plan.outputs.issue_url }}
    steps:
      - name: Checkout trusted repair policy
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - name: Pin trusted main revision
        id: source
        env:
          IS_DRILL: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'repair_drill' }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "is_drill=${IS_DRILL}" >> "$GITHUB_OUTPUT"

      - name: Download auto-heal evidence
        if: steps.source.outputs.is_drill != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOHEAL_RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p logs/autoheal
          gh run download "$AUTOHEAL_RUN_ID" \
            --repo "$REPOSITORY" \
            --name "autoheal-evidence-${AUTOHEAL_RUN_ID}" \
            --dir logs/autoheal

      - name: Prepare controlled verification failure
        if: steps.source.outputs.is_drill == 'true'
        run: python scripts/autoheal_drill.py prepare --evidence logs/autoheal

      - name: Gate cloud LLM execution
        id: plan
        env:
          REPOSITORY: ${{ github.repository }}
        run: >-
          python scripts/cloud_repair_gate.py --evidence logs/autoheal
          --output "$GITHUB_OUTPUT" --repository "$REPOSITORY"

  generate_patch:
    name: Generate repair patch with Codex
    needs: inspect_escalation
    if: ${{ needs.inspect_escalation.outputs.should_run == 'true' }}
    # Keep the privilege-drop runtime stable as ubuntu-latest rolls forward.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    outputs:
      has_patch: ${{ steps.diff.outputs.has_patch }}
    steps:
      - name: Checkout pinned trusted revision without credentials
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.inspect_escalation.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download auto-heal evidence
        if: needs.inspect_escalation.outputs.is_drill != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOHEAL_RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p logs/autoheal
          gh run download "$AUTOHEAL_RUN_ID" \
            --repo "$REPOSITORY" \
            --name "autoheal-evidence-${AUTOHEAL_RUN_ID}" \
            --dir logs/autoheal

      - name: Reproduce controlled verification failure
        if: needs.inspect_escalation.outputs.is_drill == 'true'
        run: python scripts/autoheal_drill.py prepare --evidence logs/autoheal

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.2"
          cache: npm

      - name: Install dependencies before exposing the API key
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          npm ci

      - name: Require dedicated cloud LLM credential
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_RESPONSES_API_ENDPOINT: ${{ secrets.OPENAI_RESPONSES_API_ENDPOINT }}
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::Set a dedicated OPENAI_API_KEY GitHub Actions secret for Cloud LLM Repair."
            exit 1
          fi
          if [ -z "${OPENAI_RESPONSES_API_ENDPOINT:-}" ]; then
            echo "::error::Set OPENAI_RESPONSES_API_ENDPOINT to the provider's complete HTTPS /responses endpoint."
            exit 1
          fi

      - name: Generate minimal repair patch
        id: codex
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1, pinned to the verified connection runtime
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          responses-api-endpoint: ${{ secrets.OPENAI_RESPONSES_API_ENDPOINT }}
          model: gpt-5.6-sol
          codex-version: "0.167.0"
          prompt-file: ${{ needs.inspect_escalation.outputs.is_drill == 'true' && '.github/codex/prompts/autoheal-drill.md' || '.github/codex/prompts/autoheal-repair.md' }}
          output-file: logs/autoheal/codex-output.md
          codex-args: '["--ephemeral"]'
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          allow-bots: true

      - name: Serialize patch artifact
        id: diff
        env:
          IS_DRILL: ${{ needs.inspect_escalation.outputs.is_drill }}
        run: |
          git add -N .
          git diff --binary HEAD > codex.patch
          if [ -s codex.patch ]; then
            echo "has_patch=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_patch=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Codex completed without producing a patch."
            if [ "$IS_DRILL" = "true" ]; then
              echo "::error::Controlled repair drill did not produce a patch."
              exit 1
            fi
          fi

      - name: Upload Codex output and patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-llm-repair-${{ github.run_id }}
          path: |
            codex.patch
            logs/autoheal/codex-output.md
          if-no-files-found: ignore
          retention-days: 14

  validate_patch:
    name: Validate repair without LLM credentials
    needs:
      - inspect_escalation
      - generate_patch
    if: ${{ needs.generate_patch.outputs.has_patch == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout pinned trusted revision without credentials
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.inspect_escalation.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download generated patch
        uses: actions/download-artifact@v4
        with:
          name: cloud-llm-repair-${{ github.run_id }}

      - name: Apply patch
        env:
          IS_DRILL: ${{ needs.inspect_escalation.outputs.is_drill }}
        run: |
          if [ "$IS_DRILL" = "true" ]; then
            python scripts/autoheal_drill.py validate-patch codex.patch
            cp scripts/autoheal_drill.py "$RUNNER_TEMP/platehk-autoheal-drill.py"
          fi
          git apply --index codex.patch
          if [ "$IS_DRILL" = "true" ]; then
            python "$RUNNER_TEMP/platehk-autoheal-drill.py" --root "$GITHUB_WORKSPACE" verify-candidate
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.2"
          cache: npm

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          npm ci

      - name: Validate proposed repair
        env:
          PYTHON_BIN: python
          PYTHONPYCACHEPREFIX: /tmp/pvrm-pycache
        run: |
          git diff --cached --check
          python scripts/scan_repo_secrets.py
          ./scripts/check_site.sh

  open_draft_pr:
    name: Open draft repair PR
    needs:
      - inspect_escalation
      - generate_patch
      - validate_patch
    if: ${{ needs.validate_patch.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout pinned trusted revision
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.inspect_escalation.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Preserve trusted notification code before applying the patch
        run: cp scripts/notify_telegram.py "$RUNNER_TEMP/platehk-notify-telegram.py"

      - name: Preserve trusted drill validator before applying the patch
        if: needs.inspect_escalation.outputs.is_drill == 'true'
        run: cp scripts/autoheal_drill.py "$RUNNER_TEMP/platehk-autoheal-drill.py"

      - name: Download validated patch
        uses: actions/download-artifact@v4
        with:
          name: cloud-llm-repair-${{ github.run_id }}

      - name: Apply and publish draft repair PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOHEAL_RUN_ID: ${{ github.event.workflow_run.id }}
          BASE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CLASSIFICATION: ${{ needs.inspect_escalation.outputs.classification }}
          ISSUE_NUMBER: ${{ needs.inspect_escalation.outputs.issue_number }}
          IS_DRILL: ${{ needs.inspect_escalation.outputs.is_drill }}
          SOURCE_SHA: ${{ needs.inspect_escalation.outputs.source_sha }}
        run: |
          base="${BASE_BRANCH:-main}"
          branch="codex/autoheal-${AUTOHEAL_RUN_ID}-${GITHUB_RUN_ID}"
          title="Draft auto-heal repair: ${CLASSIFICATION}"
          gh auth setup-git
          if [ "$IS_DRILL" = "true" ]; then
            python "$RUNNER_TEMP/platehk-autoheal-drill.py" --root "$GITHUB_WORKSPACE" validate-patch codex.patch
            base="codex/autoheal-drill-base-${GITHUB_RUN_ID}"
            branch="codex/autoheal-drill-repair-${GITHUB_RUN_ID}"
            title="Controlled auto-heal drill (do not merge)"
            git push origin "${SOURCE_SHA}:refs/heads/${base}"
          fi
          git apply --index codex.patch
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$IS_DRILL" = "true" ]; then
            # Re-running only publication must reuse the same commit and PR.
            drill_date="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .created_at)"
            GIT_AUTHOR_DATE="$drill_date" GIT_COMMITTER_DATE="$drill_date" \
              git commit -m "Draft auto-heal repair for ${CLASSIFICATION}"
          else
            git commit -m "Draft auto-heal repair for ${CLASSIFICATION}"
          fi
          git push --set-upstream origin "$branch"

          {
            if [ "$IS_DRILL" = "true" ]; then
              echo "Controlled repair drill only. This fixture-only PR must never be merged."
              echo
            fi
            echo "Cloud Codex generated this minimal repair after deterministic auto-heal stopped."
            echo
            echo "- Classification: \`${CLASSIFICATION}\`"
            echo "- Evidence run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${AUTOHEAL_RUN_ID:-$GITHUB_RUN_ID}"
            echo "- Validation: secret scan and \`scripts/check_site.sh\` passed in a separate job without the OpenAI key."
            echo
            echo "This PR is intentionally draft and must be reviewed before merge."
          } > pr-body.md

          pr_url=""
          if [ "$IS_DRILL" = "true" ]; then
            pr_url="$(gh pr list --repo "$GITHUB_REPOSITORY" --base "$base" --head "$branch" \
              --state all --json url --jq '.[0].url // empty')"
          fi
          if [ -z "$pr_url" ]; then
            pr_url="$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$base" \
              --head "$branch" \
              --draft \
              --title "$title" \
              --body-file pr-body.md)"
          fi
          echo "url=${pr_url}" >> "$GITHUB_OUTPUT"

          if [ "$IS_DRILL" = "true" ]; then
            mkdir -p logs/autoheal
            gh pr view "$pr_url" --repo "$GITHUB_REPOSITORY" \
              --json number,url,baseRefName,headRefName,isDraft,state,mergedAt,headRefOid > logs/autoheal/drill-pr.json
            state="$(python -c 'import json; print(json.load(open("logs/autoheal/drill-pr.json"))["state"])')"
            if [ "$state" != "CLOSED" ]; then
              python "$RUNNER_TEMP/platehk-autoheal-drill.py" --root "$GITHUB_WORKSPACE" verify-pr \
                --receipt logs/autoheal/drill-pr.json --run-id "$GITHUB_RUN_ID"
              gh pr close "$pr_url" --repo "$GITHUB_REPOSITORY"
              gh pr view "$pr_url" --repo "$GITHUB_REPOSITORY" \
                --json number,url,baseRefName,headRefName,isDraft,state,mergedAt,headRefOid > logs/autoheal/drill-pr.json
            fi
            python "$RUNNER_TEMP/platehk-autoheal-drill.py" --root "$GITHUB_WORKSPACE" verify-pr \
              --receipt logs/autoheal/drill-pr.json --run-id "$GITHUB_RUN_ID" --closed
            echo "Controlled automatic repair drill passed: ${pr_url}" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --body "Cloud Codex produced a validated draft repair PR: ${pr_url}"
          fi

      - name: Notify Telegram about draft repair PR
        if: needs.inspect_escalation.outputs.is_drill != 'true'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
          TELEGRAM_TEXT: |-
            PlateHK cloud LLM repair is ready for review.
            Classification: ${{ needs.inspect_escalation.outputs.classification }}
            The PR is draft and was not merged automatically.
          TELEGRAM_LINK: ${{ steps.pr.outputs.url }}
        run: >-
          python -I "$RUNNER_TEMP/platehk-notify-telegram.py" send --optional
          --text-env TELEGRAM_TEXT --link-env TELEGRAM_LINK
          --link-label "Review draft PR"

      - name: Preserve controlled drill receipt
        if: always() && needs.inspect_escalation.outputs.is_drill == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: autoheal-drill-receipt-${{ github.run_id }}
          path: logs/autoheal/drill-pr.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  report_failure:
    name: Report cloud LLM failure
    needs:
      - inspect_escalation
      - generate_patch
      - validate_patch
      - open_draft_pr
    if: >-
      ${{ always() && needs.inspect_escalation.outputs.is_drill != 'true' && needs.inspect_escalation.outputs.should_run == 'true' &&
          (needs.generate_patch.result == 'failure' ||
           needs.generate_patch.outputs.has_patch != 'true' ||
           needs.validate_patch.result == 'failure' ||
           needs.open_draft_pr.result == 'failure') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Comment on repair issue
        if: ${{ needs.inspect_escalation.outputs.issue_number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.inspect_escalation.outputs.issue_number }}
        run: >-
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"
          --body "Cloud LLM repair did not produce a validated draft PR. Inspect run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."

      - name: Notify Telegram about cloud LLM failure
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
          TELEGRAM_TEXT: |-
            PlateHK cloud LLM repair needs human follow-up.
            Classification: ${{ needs.inspect_escalation.outputs.classification }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TELEGRAM_LINK: ${{ needs.inspect_escalation.outputs.issue_url }}
        run: >-
          python scripts/notify_telegram.py send --optional
          --text-env TELEGRAM_TEXT --link-env TELEGRAM_LINK
          --link-label "Open repair issue"
