name: Auto Update Data

on:
  schedule:
    # 08:40 Hong Kong time.
    - cron: "40 0 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Update mode"
        type: choice
        required: true
        default: incremental
        options:
          - incremental
          - full
      deploy:
        description: "Deploy to Cloudflare when data changed or production drifted"
        type: boolean
        required: true
        default: true

concurrency:
  group: platehk-auto-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    name: Refresh generated data
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: "1"
      CHECK_SECURITY_SKIP_DEPS: "1"
      PYTHONPYCACHEPREFIX: /tmp/pvrm-pycache
      WRANGLER_SEND_METRICS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install Python dependencies
        run: |
          python --version
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Snapshot database before update
        run: >-
          python scripts/build_update_telegram_report.py snapshot
          --output "$RUNNER_TEMP/platehk-before-update.json"

      - name: Run updater
        env:
          MODE: ${{ github.event.inputs.mode || 'incremental' }}
        run: bash scripts/cron_update.sh

      - name: Run local verification
        env:
          PYTHON_BIN: python
        run: ./scripts/check_site.sh

      - name: Compare generated output with production
        id: freshness
        run: |
          set +e
          python scripts/check_production_freshness.py --base-url https://plate.hk --fail-on-drift
          status=$?
          set -e
          case "$status" in
            0)
              echo "drift=false" >> "$GITHUB_OUTPUT"
              ;;
            2)
              echo "drift=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              exit "$status"
              ;;
          esac

      - name: Stage generated changes
        id: changes
        run: |
          git add \
            api/v1 \
            assets \
            data \
            plates \
            index.html \
            landing.html \
            audit.html \
            api.html \
            camera.html \
            changelog.html \
            terms.html \
            privacy.html \
            mcp.html \
            robots.txt \
            sitemap.xml \
            llms.txt \
            agent.md \
            skill.md \
            sw.js
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No generated data changes."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit generated changes
        id: commit
        if: ${{ steps.changes.outputs.changed == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto-update PlateHK data ($(date -u +%Y-%m-%d))"
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Check Cloudflare deploy credentials
        if: ${{ github.event.inputs.deploy != 'false' && (steps.changes.outputs.changed == 'true' || steps.freshness.outputs.drift == 'true') }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN GitHub Actions repository secret. Required for scheduled Cloudflare deploys."
            exit 1
          fi

      - name: Deploy to Cloudflare
        if: ${{ github.event.inputs.deploy != 'false' && (steps.changes.outputs.changed == 'true' || steps.freshness.outputs.drift == 'true') }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run cf:deploy:ci

      - name: Verify production after deploy
        if: ${{ github.event.inputs.deploy != 'false' && (steps.changes.outputs.changed == 'true' || steps.freshness.outputs.drift == 'true') }}
        run: |
          for attempt in 1 2 3 4 5; do
            if python scripts/check_production_freshness.py --base-url https://plate.hk --fail-on-drift; then
              exit 0
            fi
            echo "Production is not fresh yet; retrying in 20 seconds (attempt ${attempt}/5)."
            sleep 20
          done
          python scripts/check_production_freshness.py --base-url https://plate.hk --fail-on-drift

      - name: Build Telegram update report
        id: telegram_report
        if: ${{ success() }}
        continue-on-error: true
        env:
          GENERATED_CHANGED: ${{ steps.changes.outputs.changed || 'false' }}
          GENERATED_COMMITTED: ${{ steps.commit.outputs.committed || 'false' }}
          DEPLOY_ENABLED: ${{ github.event.inputs.deploy != 'false' }}
          DRIFT_BEFORE: ${{ steps.freshness.outputs.drift || 'false' }}
          UPDATE_MODE: ${{ github.event.inputs.mode || 'incremental' }}
        run: |
          python scripts/build_update_telegram_report.py report \
            --before "$RUNNER_TEMP/platehk-before-update.json" \
            --output "$RUNNER_TEMP/platehk-update-report.txt" \
            --generated-changed "$GENERATED_CHANGED" \
            --committed "$GENERATED_COMMITTED" \
            --deploy-enabled "$DEPLOY_ENABLED" \
            --drift-before "$DRIFT_BEFORE" \
            --mode "$UPDATE_MODE" \
            --commit-sha "$(git rev-parse HEAD)"
          {
            echo "### Telegram update report"
            echo ""
            echo '```text'
            cat "$RUNNER_TEMP/platehk-update-report.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Send Telegram update report
        id: telegram_notify
        if: ${{ steps.telegram_report.outcome == 'success' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
          TELEGRAM_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python scripts/notify_telegram.py send
          --text-file "$RUNNER_TEMP/platehk-update-report.txt"
          --link-env TELEGRAM_LINK
          --link-label "View update run"

      - name: Write summary
        if: always()
        run: |
          {
            echo "### PlateHK auto-update"
            echo ""
            echo "- Generated data changed: ${{ steps.changes.outputs.changed || 'unknown' }}"
            echo "- Generated data committed: ${{ steps.commit.outputs.committed || 'false' }}"
            echo "- Production drift before deploy: ${{ steps.freshness.outputs.drift || 'unknown' }}"
            echo "- Deploy input enabled: ${{ github.event.inputs.deploy != 'false' }}"
            echo "- Mode: ${{ github.event.inputs.mode || 'incremental' }}"
            echo "- Telegram report: ${{ steps.telegram_notify.outcome || 'not-run' }}"
          } >> "$GITHUB_STEP_SUMMARY"
