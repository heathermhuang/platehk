name: Auto Update Data

on:
  schedule:
    # Collect the hourly Cloudflare observation every six hours; unchanged checks skip all build steps.
    - cron: "47 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: "Refresh scope"
        type: choice
        default: official
        options: [official, events, market, check]
      mode:
        description: "Update mode"
        type: choice
        default: incremental
        options: [incremental, full]
      deploy:
        description: "Deploy validated outputs to Cloudflare"
        type: boolean
        default: true
      notify:
        description: "Send the existing Telegram update report"
        type: boolean
        default: true
      force:
        description: "Force a verified refresh or code release even when sources are unchanged"
        type: boolean
        default: false
      probe_id:
        description: "Source observer lease ID (leave empty for manual runs)"
        type: string
        default: ""
  workflow_call:
    inputs:
      scope: {type: string, default: market}
      mode: {type: string, default: incremental}
      deploy: {type: boolean, default: true}
      notify: {type: boolean, default: true}
      force: {type: boolean, default: false}
      probe_id: {type: string, default: ""}

concurrency:
  group: platehk-data-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    name: Refresh generated data
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      CI: "1"
      CHECK_SECURITY_SKIP_DEPS: "1"
      PYTHONPYCACHEPREFIX: /tmp/pvrm-pycache
      WRANGLER_SEND_METRICS: "false"
      REFRESH_CONTROL_URL: ${{ vars.REFRESH_CONTROL_URL }}
      DEPLOY_ENABLED: ${{ inputs.deploy || (github.event_name == 'schedule' && inputs.scope == '') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Plan refresh before installing dependencies
        id: plan
        env:
          REFRESH_CONTROL_TOKEN: ${{ secrets.REFRESH_CONTROL_TOKEN }}
          REFRESH_SCOPE: ${{ inputs.scope || 'check' }}
          REFRESH_FORCE: ${{ inputs.force || false }}
          REFRESH_MODE: ${{ inputs.mode || 'incremental' }}
          REFRESH_PROBE_ID: ${{ inputs.probe_id || '' }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          node scripts/refresh_control.mjs plan

      - name: Set up Python
        if: steps.plan.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node
        if: steps.plan.outputs.run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.2"
          cache: npm

      - name: Install Python dependencies
        if: steps.plan.outputs.run == 'true'
        run: python -m pip install -r requirements.txt

      - name: Install Node dependencies
        if: steps.plan.outputs.run == 'true'
        run: npm ci

      - name: Restore content-addressed PDF parsing cache
        if: steps.plan.outputs.run == 'true' && steps.plan.outputs.scope == 'official'
        id: pdf_cache
        uses: actions/cache/restore@v4
        with:
          path: .tmp/pdf-parse-cache
          key: platehk-pdf-v1-${{ runner.os }}-${{ hashFiles('scripts/build_dataset.py', 'scripts/build_tvrm_dataset.py', 'scripts/lny_mixed_parser.py', 'scripts/parse_tvrm_pdfs.py', 'scripts/pdf_parse_cache.py', 'requirements.txt') }}-${{ github.run_id }}
          restore-keys: |
            platehk-pdf-v1-${{ runner.os }}-${{ hashFiles('scripts/build_dataset.py', 'scripts/build_tvrm_dataset.py', 'scripts/lny_mixed_parser.py', 'scripts/parse_tvrm_pdfs.py', 'scripts/pdf_parse_cache.py', 'requirements.txt') }}-

      - name: Snapshot database before update
        if: steps.plan.outputs.run == 'true'
        run: python scripts/build_update_telegram_report.py snapshot --output "$RUNNER_TEMP/platehk-before-update.json"

      - name: Refresh privacy-minimized 28car sale signals
        if: steps.plan.outputs.run == 'true' && steps.plan.outputs.scope == 'market'
        run: >-
          python scripts/scrape_28car_market.py
          --max-pages 0 --require-complete --concurrency 4 --request-delay 0.75

      - name: Persist complete private market snapshot
        if: steps.plan.outputs.run == 'true' && steps.plan.outputs.scope == 'market'
        env:
          REFRESH_CONTROL_TOKEN: ${{ secrets.REFRESH_CONTROL_TOKEN }}
        run: node scripts/refresh_control.mjs store-market

      - name: Restore previous complete private market snapshot
        if: steps.plan.outputs.run == 'true' && steps.plan.outputs.scope != 'market'
        env:
          REFRESH_CONTROL_TOKEN: ${{ secrets.REFRESH_CONTROL_TOKEN }}
        run: node scripts/refresh_control.mjs restore-market

      - name: Refresh observer-verified changed PDF inputs
        if: steps.plan.outputs.run == 'true' && steps.plan.outputs.scope == 'official'
        run: python scripts/refresh_sources.py apply

      - name: Run updater
        if: steps.plan.outputs.run == 'true' && steps.plan.outputs.scope != 'market'
        env:
          MODE: ${{ inputs.mode || 'incremental' }}
          REFRESH_BUILD_SCOPE: ${{ steps.plan.outputs.scope }}
        run: bash scripts/cron_update.sh

      - name: Build actual parsed-input catalog
        if: steps.plan.outputs.run == 'true' && steps.plan.outputs.scope == 'official'
        run: python scripts/refresh_sources.py catalog

      # Only qualified parser results are cached. A later test or deployment
      # failure must not discard them and force another full historical parse.
      - name: Save validated PDF parsing results
        continue-on-error: true
        if: success() && steps.plan.outputs.run == 'true' && steps.plan.outputs.scope == 'official'
        uses: actions/cache/save@v4
        with:
          path: .tmp/pdf-parse-cache
          key: ${{ steps.pdf_cache.outputs.cache-primary-key }}

      - name: Run local verification
        if: steps.plan.outputs.run == 'true'
        env:
          PYTHON_BIN: python
        run: ./scripts/check_site.sh

      - name: Stage generated changes
        if: steps.plan.outputs.run == 'true' && steps.plan.outputs.scope != 'market'
        id: changes
        run: |
          git add api/v1 assets data plates auction-results index.html landing.html about.html audit.html api.html camera.html changelog.html terms.html privacy.html mcp.html robots.txt sitemap.xml llms.txt agent.md skill.md sw.js
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated changes
        if: steps.changes.outputs.changed == 'true' && env.DEPLOY_ENABLED == 'true'
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto-update PlateHK data ($(date -u +%Y-%m-%d))"
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy daily market snapshot to Cloudflare
        if: steps.plan.outputs.run == 'true' && steps.plan.outputs.scope == 'market' && env.DEPLOY_ENABLED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run cf:deploy:ci

      - name: Deploy official data using the previous complete market snapshot
        if: steps.plan.outputs.run == 'true' && steps.plan.outputs.scope != 'market' && env.DEPLOY_ENABLED == 'true' && (steps.changes.outputs.changed == 'true' || inputs.force || inputs.mode == 'full')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run cf:deploy:official

      - name: Verify production after deploy
        if: steps.plan.outputs.run == 'true' && env.DEPLOY_ENABLED == 'true'
        run: |
          verified=false
          for attempt in 1 2 3 4 5; do
            if python scripts/check_production_freshness.py --base-url https://plate.hk --fail-on-drift \
              && python scripts/check_market_production.py --base-url https://plate.hk --allow-expired; then
              verified=true
              break
            fi
            sleep 20
          done
          test "$verified" = true

      - name: Acknowledge verified publication
        if: steps.plan.outputs.run == 'true' && env.DEPLOY_ENABLED == 'true'
        env:
          REFRESH_CONTROL_TOKEN: ${{ secrets.REFRESH_CONTROL_TOKEN }}
        run: node scripts/refresh_control.mjs ack

      - name: Build Telegram update report
        if: steps.plan.outputs.run == 'true' && env.DEPLOY_ENABLED == 'true' && (github.event_name == 'schedule' || inputs.notify)
        id: telegram_report
        continue-on-error: true
        run: |
          python scripts/build_update_telegram_report.py report \
            --before "$RUNNER_TEMP/platehk-before-update.json" \
            --output "$RUNNER_TEMP/platehk-update-report.txt" \
            --generated-changed "${{ steps.changes.outputs.changed || 'false' }}" \
            --committed "${{ steps.commit.outputs.committed || 'false' }}" \
            --deploy-enabled true --drift-before false \
            --mode "${{ steps.plan.outputs.scope }}" --commit-sha "$(git rev-parse HEAD)"

      - name: Send Telegram update report
        if: steps.telegram_report.outcome == 'success'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
          TELEGRAM_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/notify_telegram.py send --text-file "$RUNNER_TEMP/platehk-update-report.txt" --link-env TELEGRAM_LINK --link-label "View update run"

      - name: Release failed or dry-run lease
        if: always() && steps.plan.outputs.run == 'true' && (failure() || env.DEPLOY_ENABLED != 'true')
        env:
          REFRESH_CONTROL_TOKEN: ${{ secrets.REFRESH_CONTROL_TOKEN }}
          REFRESH_PROBE_ID: ${{ steps.plan.outputs.probe_id }}
        run: node scripts/refresh_control.mjs release

      - name: Write summary
        if: always()
        run: |
          {
            echo "### PlateHK conditional refresh"
            echo "- Outcome: ${{ steps.plan.outputs.outcome || 'failed' }}"
            echo "- Scope: ${{ steps.plan.outputs.scope || 'unknown' }}"
            echo "- Expensive refresh required: ${{ steps.plan.outputs.run || 'false' }}"
            echo "- Generated data committed: ${{ steps.commit.outputs.committed || 'false' }}"
          } >> "$GITHUB_STEP_SUMMARY"
